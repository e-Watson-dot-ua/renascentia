# Template for a workspace package. See README.md in this folder before you use it.
# Shared tool settings (ruff, pyright, pytest) are in the workspace root pyproject.toml.

[project]
name = "package-name"
version = "0.1.0"
description = "One sentence that says what the package does"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

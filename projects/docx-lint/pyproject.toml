[project]
name = "docx-lint"
version = "0.1.0"
description = "CLI and HTTP service that checks the structure of Word documents"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "python-docx>=1.2.0",
    "typer>=0.27.3",
]

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
